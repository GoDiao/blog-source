site_description: Diao Shengjia — AI/ML research, engineering, and paper notes
site_name: Blog
site_url: https://godiao.github.io/blog/
repo_url: https://github.com/GoDiao/blog-source
copyright: Copyright &copy; 2024–2026 Diao Shengjia

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark
  font:
    text: DM Sans
    code: JetBrains Mono
  features:
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Blog: blog/index.md
  - Paper Notes: papers/index.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
      block_tag: 'pre'
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - footnotes
  - pymdownx.magiclink
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/main.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GoDiao
  analytics:
    provider: custom
