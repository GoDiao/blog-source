name: Deploy Personal Site to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx astro build

      - name: Clone current godiao.github.io
        uses: actions/checkout@v4
        with:
          repository: GoDiao/godiao.github.io
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          path: godiao.github.io

      - name: Merge and deploy
        run: |
          cd godiao.github.io
          # Remove root-level files but keep /blog/ directory
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'blog' -exec rm -rf {} +
          # Copy new site files to root
          cp -r $GITHUB_WORKSPACE/dist/* .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy personal site"
          git push
