name: Deploy Blog to GitHub Pages

on:
  push:
    branches: ["blog"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: /home/runner/.cache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: Gr1N/setup-poetry@v9
      - run: poetry install
      - run: DEPLOY=true poetry run mkdocs build

      - name: Clone current godiao.github.io
        uses: actions/checkout@v4
        with:
          repository: GoDiao/godiao.github.io
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          path: godiao.github.io

      - name: Merge and deploy blog
        run: |
          cd godiao.github.io
          rm -rf blog
          cp -r $GITHUB_WORKSPACE/site blog
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy blog"
          git push
